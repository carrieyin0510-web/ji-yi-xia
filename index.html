<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f0fb"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記一夏"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png"><title>記一夏</title>
<style>
:root{--bg:#f8f3fb;--card:#fffaf5;--text:#302a35;--muted:#817687;--line:#eadff0;--purple:#b9a0d4;--purple2:#eee5f7;--orange:#e9b987;--orange2:#fff0df;--red:#b45d69;--green:#5f856f}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,var(--purple2),var(--orange2));background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:auto}.card{background:rgba(255,253,250,.94);border:1px solid rgba(210,192,220,.7);border-radius:20px;padding:16px;margin:12px 0}h1{font-size:27px;margin:4px 0}.sub,.meta,label{font-size:13px;color:var(--muted)}.sub{margin-bottom:12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab,.btn{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px}.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}
label{display:block;margin:12px 0 6px}input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}textarea{min-height:64px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.primary{width:100%;min-height:48px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--purple),var(--orange));color:#fff;font-size:16px;font-weight:800;margin-top:15px}
.balanceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bal,.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.bal small,.sum small{display:block;color:var(--muted)}.bal strong,.sum strong{display:block;margin-top:4px;font-size:18px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chartWrap{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:18px;align-items:center;margin-top:12px}.pie{width:100%;aspect-ratio:1;border-radius:50%;background:#eee;position:relative}.pie:after{content:"";position:absolute;inset:28%;background:#fffaf5;border-radius:50%}.legend{display:grid;gap:7px}.legendRow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px}
.tx{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:8px}.tx:first-child{border-top:0}.title{font-weight:700}.amt{font-weight:800}.expense{color:var(--red)}.income{color:var(--green)}.transfer{color:#806aa0}.del{border:0;background:none;color:var(--red);padding:5px 0}.hide{display:none}.empty{text-align:center;color:var(--muted);padding:16px}
@media(max-width:500px){.hero{grid-template-columns:auto 1fr}.windowBadge{display:none}.hero h1{font-size:31px}.row,.balanceGrid,.chartWrap{grid-template-columns:1fr}.pie{max-width:230px;margin:auto}.summary{grid-template-columns:1fr 1fr}.summary .sum:last-child{grid-column:1/-1}}

.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;background:rgba(255,250,239,.92);border:1px solid #bdb7ae;border-radius:19px;padding:16px;margin:4px 0 14px;box-shadow:3px 3px 0 rgba(83,78,72,.12)}
.hero:after{content:"";position:absolute;right:-22px;bottom:-28px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#d7c6ff 28%,#ffb7a9 56%,#91b8c8 78%,#ddd 100%);opacity:.55}
.eyebrow{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;color:#625d58}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:1px;margin:1px 0}.hero .sub{font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;margin:0;color:#6f6964}
.apple{width:53px;height:53px;border-radius:44% 48% 46% 50%;display:grid;place-items:center;font-size:0;background:radial-gradient(circle at 32% 25%,#fff 0 7%,#f7a9bb 18%,#bba9e8 43%,#8eb6c4 68%,#eee0cf 88%);border:1px solid #777;box-shadow:inset -6px -7px 10px rgba(255,255,255,.45),2px 3px 0 rgba(70,65,60,.12);transform:rotate(-5deg)}
.apple:before{content:"";width:7px;height:18px;background:#65594c;border-radius:5px;position:absolute;transform:translate(7px,-32px) rotate(18deg)}
.windowBadge{z-index:1;width:105px;border:1px solid #777;background:#f6f0e7;box-shadow:2px 2px 0 #a9a29a;font:8px ui-monospace,SFMono-Regular,Menlo,monospace}.windowBadge span{display:block;border-bottom:1px solid #999;padding:2px 4px;background:#d9d4ca}.windowBadge b{display:block;padding:7px 5px;line-height:1.4}
.checker{position:absolute;inset:auto 0 0 auto;width:72px;height:30px;opacity:.12;background:conic-gradient(#333 25%,transparent 0 50%,#333 0 75%,transparent 0) 0 0/14px 14px}
body{background-color:#e9e1d4!important;background-image:linear-gradient(rgba(84,78,70,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(84,78,70,.07) 1px,transparent 1px),radial-gradient(circle at 20% 10%,rgba(176,202,226,.55),transparent 28%),radial-gradient(circle at 85% 25%,rgba(238,180,191,.45),transparent 25%)!important;background-size:18px 18px,18px 18px,auto,auto!important}
.card{border-color:#c8c0b6!important;box-shadow:2px 3px 0 rgba(76,70,64,.09);background:rgba(251,247,239,.94)!important}
.tab{border-color:#bbb2a9!important}.tab.active{background:linear-gradient(135deg,#f29cab,#b7a8e5)!important;border-color:#8b829a!important}
.primary{background:linear-gradient(90deg,#b7a8e5,#f3a0ad,#f0bd83)!important;border:1px solid #8e8391!important;box-shadow:2px 2px 0 rgba(72,66,62,.18)}
input,select,textarea{background:#fbf8f2!important;border-color:#c9c1b8!important}


.categorySummary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.categoryCard{border:1px solid var(--line);background:#fffaf5;border-radius:14px;padding:12px;text-align:left;color:var(--text);min-height:70px}
.categoryCard.active{outline:2px solid #a990c5;background:#f4ecfb}
.categoryCard small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.categoryCard strong{font-size:19px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.miniBtn{width:auto;padding:7px 12px;min-height:36px}
.compactSelect{width:auto;max-width:145px;padding:8px 10px;font-size:13px}
.activeFilter{margin:12px 0 4px;background:#eee5f7;border:1px solid #d7c6e6;border-radius:12px;padding:10px 12px;font-size:13px}
.merchantSettings{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.merchantSettings summary{font-size:13px;color:var(--muted);cursor:pointer}
.merchantManager{padding-top:9px}.merchantTag{display:inline-flex;align-items:center;gap:5px;background:#efe7dc;border:1px solid #d9cec1;border-radius:999px;padding:6px 9px;margin:3px;font-size:12px}.merchantTag button{border:0;background:none;color:var(--red);padding:0;font-size:15px}
.tx{border:1px solid #ddd1c5!important;border-radius:15px;padding:13px!important;margin:9px 0;background:#fffaf5;grid-template-columns:1fr auto!important}
.txActions{display:flex;gap:12px;margin-top:7px}.editBtn,.del{border:0;background:none;padding:2px 0;font-size:13px}.editBtn{color:#6f5b85}.del{color:var(--red)}
.txCategory{display:inline-block;padding:3px 8px;border-radius:999px;background:#efe6f6;margin-right:5px}
.modal{position:fixed;inset:0;background:rgba(42,35,47,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modalSheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fbf7ef;border:1px solid #bcb2a9;border-radius:22px 22px 16px 16px;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.iconBtn{border:1px solid var(--line);background:#fffaf5;border-radius:50%;width:36px;height:36px;font-size:16px}
body.modalOpen{overflow:hidden}
@media(max-width:500px){.categorySummary{grid-template-columns:1fr 1fr}.sectionHead{align-items:flex-start}.compactSelect{max-width:125px}.modal{padding:0}.modalSheet{border-radius:22px 22px 0 0;max-height:92vh}}

</style></head><body><div class="wrap">
<div class="hero">
  <div class="checker"></div>
  <div class="apple">◉</div>
  <div>
    <div class="eyebrow">MONEY LOG — EST. 2026</div>
    <h1>記一夏 <span style="font-size:.42em;font-weight:700;opacity:.55;vertical-align:middle">V7</span></h1>
    <div class="sub">YOUR MONEY, YOUR STORY.</div>
  </div>
  <div class="windowBadge"><span>● ● ●</span><b>GOOD MONEY<br>BETTER DAYS</b></div>
</div>

<div class="card" id="setupCard"><strong>帳戶初始餘額</strong><div class="meta">第一次設定目前實際餘額；之後每筆交易會從這個基準推算。</div><div id="initialInputs"></div><button class="primary" id="saveInitial">儲存初始餘額</button></div>
<div class="card"><strong>目前總資產</strong><div style="font-size:28px;font-weight:800;margin:7px 0" id="totalAssets">$0</div><div id="balances" class="balanceGrid"></div><div class="toolbar"><button class="btn" id="editInitial">修改初始餘額</button></div></div>


<div class="card">
<div class="tabs"><button class="tab active" id="tabExpense">支出</button><button class="tab" id="tabIncome">收入</button><button class="tab" id="tabTransfer">轉帳</button></div>

<div id="normalFields">
  <label>金額</label>
  <input id="amount" type="number" inputmode="decimal" min="0" placeholder="例如 65">
</div>

<div id="expenseFields">
  <label>支出分類</label>
  <select id="expenseCategory"></select>

  <label>店家／用途</label>
  <select id="merchantSelect"></select>
  <input id="customMerchant" class="hide" placeholder="輸入其他店家／用途" style="margin-top:8px">

  <div class="row">
    <div><label>付款方式</label><select id="payment"></select></div>
    <div><label>扣款帳戶</label><select id="expenseAccount"></select></div>
  </div>

  <details class="merchantSettings">
    <summary>管理這個分類的常用店家</summary>
    <div class="merchantManager">
      <div id="merchantTags"></div>
      <div class="row">
        <input id="newMerchant" placeholder="新增常用店家">
        <button class="btn" id="addMerchant" type="button">新增</button>
      </div>
    </div>
  </details>
</div>

<div id="incomeFields" class="hide">
  <label>收入來源</label>
  <input id="incomeName" placeholder="例如 打工薪水">
  <div class="row">
    <div><label>入帳帳戶</label><select id="incomeAccount"></select></div>
    <div><label>收入分類</label><select id="incomeCategory"></select></div>
  </div>
</div>

<div id="transferFields" class="hide">
  <label>轉帳說明</label>
  <input id="transferName" placeholder="例如 彰銀轉國泰">
  <div class="row">
    <div><label>從哪個帳戶</label><select id="fromAccount"></select></div>
    <div><label>轉到哪個帳戶</label><select id="toAccount"></select></div>
  </div>
  <label>轉帳類型</label>
  <select id="transferKind"><option>帳戶互轉</option><option>提款</option><option>存款</option></select>
</div>

<label>備註（可不填）</label>
<textarea id="note"></textarea>
<button class="primary" id="saveEntry">記一筆支出</button>
</div>

<div class="card">
  <div class="summary">
    <div class="sum"><small>本月收入</small><strong id="sumIncome">$0</strong></div>
    <div class="sum"><small>本月支出</small><strong id="sumExpense">$0</strong></div>
    <div class="sum"><small>本月收支差額</small><strong id="sumBalance">$0</strong></div>
  </div>
  <div class="meta" style="margin-top:9px">收支差額 = 本月收入 − 本月支出；不含初始餘額，也不把自己的帳戶互轉算成收入或支出。</div>
</div>

<div class="card">
  <div class="sectionHead">
    <div><strong>本月分類支出</strong><div class="meta">每個分類各自計算金額；點分類即可篩選下方紀錄。</div></div>
    <button class="btn miniBtn" id="clearFilter">全部</button>
  </div>
  <div id="categorySummary" class="categorySummary"></div>
</div>

<div class="card">
  <strong>本月支出比例</strong>
  <div class="chartWrap"><div id="pie" class="pie"></div><div id="legend" class="legend"></div></div>
</div>

<div class="card">
  <div class="sectionHead">
    <div><strong>記帳紀錄</strong><div class="meta" id="listHint">條列查看；可依分類篩選，也可以編輯每一筆紀錄。</div></div>
    <select id="recordTypeFilter" class="compactSelect">
      <option value="all">全部類型</option>
      <option value="expense">只看支出</option>
      <option value="income">只看收入</option>
      <option value="transfer">只看轉帳</option>
    </select>
  </div>
  <div id="activeFilter" class="activeFilter hide"></div>
  <div id="list"></div>
  <div class="toolbar">
    <button class="btn" id="exportCsv">匯出 CSV</button>
    <button class="btn" id="backupJson">備份資料</button>
    <button class="btn" id="restoreJson">還原資料</button>
    <input id="restoreFile" type="file" accept=".json,application/json" class="hide">
  </div>
</div>

<div id="editModal" class="modal hide" aria-hidden="true">
  <div class="modalSheet">
    <div class="sectionHead"><strong>編輯記帳</strong><button class="iconBtn" id="closeEdit" type="button">✕</button></div>
    <div id="editExpenseFields">
      <label>金額</label><input id="editAmount" type="number" inputmode="decimal" min="0">
      <label>分類</label><select id="editCategory"></select>
      <label>店家／用途</label><input id="editName">
      <div class="row">
        <div><label>付款方式</label><select id="editPayment"></select></div>
        <div><label>扣款帳戶</label><select id="editAccount"></select></div>
      </div>
      <label>備註</label><textarea id="editNote"></textarea>
    </div>
    <div id="editIncomeFields" class="hide">
      <label>金額</label><input id="editIncomeAmount" type="number" inputmode="decimal" min="0">
      <label>收入來源</label><input id="editIncomeName">
      <div class="row">
        <div><label>收入分類</label><select id="editIncomeCategory"></select></div>
        <div><label>入帳帳戶</label><select id="editIncomeAccount"></select></div>
      </div>
      <label>備註</label><textarea id="editIncomeNote"></textarea>
    </div>
    <div id="editTransferFields" class="hide">
      <label>金額</label><input id="editTransferAmount" type="number" inputmode="decimal" min="0">
      <label>轉帳說明</label><input id="editTransferName">
      <div class="row">
        <div><label>從哪個帳戶</label><select id="editFrom"></select></div>
        <div><label>轉到哪個帳戶</label><select id="editTo"></select></div>
      </div>
      <label>轉帳類型</label><select id="editTransferKind"><option>帳戶互轉</option><option>提款</option><option>存款</option></select>
      <label>備註</label><textarea id="editTransferNote"></textarea>
    </div>
    <button class="primary" id="saveEdit" type="button">儲存修改</button>
  </div>
</div>
</div><script>
const ACC=["國泰","彰銀電子","彰銀原始","LINE Pay 餘額","現金"];
const PAY={"LINE Pay":["國泰","彰銀電子","LINE Pay 餘額"],"街口支付":["彰銀電子"],"台灣 Pay":["彰銀原始","彰銀電子"],"銀行轉帳":["國泰","彰銀電子","彰銀原始"],"現金":["現金"]};
const EC=["飲食","交通","購物","娛樂","日用品","醫療","學習","繳費","委託","投資","其他"];
const IC=["薪資","家人給予","退款","獎金／補助","委託收入","投資收入","其他收入"];
const COLORS=["#b9a0d4","#e9b987","#cfbde1","#f2cda7","#9f87bd","#dca66f","#d9c9e8","#f7dcc1","#8f76aa","#c9915d","#e8def0"];
const DEFAULT_MERCHANTS={
"飲食":["小七","全家","麥當勞","五十嵐","樂台"],
"交通":["加油","換機油","換輪胎"],
"購物":["鞋子","衣服","包包"],
"娛樂":["夏以晝","齊司禮","夏油傑","乾青宗","伊耳謎"],
"日用品":["寶雅","全聯"],
"醫療":[],
"學習":[],
"繳費":[],
"委託":[],
"投資":["ETF"],
"其他":[]
};
const $=x=>document.getElementById(x);
let mode="expense", categoryFilter="", editingId=null;
const entries=()=>JSON.parse(localStorage.getItem("ql3_entries")||"[]");
const initial=()=>JSON.parse(localStorage.getItem("ql3_initial")||"{}");
function merchantData(){
  const current=JSON.parse(localStorage.getItem("ql7_merchants")||"null");
  if(current) return current;
  const old=JSON.parse(localStorage.getItem("ql6_merchants")||"null")||{};
  const merged={};
  EC.forEach(cat=>{
    const prior=Array.isArray(old[cat])?old[cat]:[];
    const fresh=DEFAULT_MERCHANTS[cat]||[];
    merged[cat]=[...new Set([...fresh,...prior])];
  });
  localStorage.setItem("ql7_merchants",JSON.stringify(merged));
  return merged;
}
const saveMerchants=o=>localStorage.setItem("ql7_merchants",JSON.stringify(o));
const money=n=>"$"+Number(n||0).toLocaleString("zh-TW");
function fill(e,a){e.innerHTML="";a.forEach(x=>{let o=document.createElement("option");o.textContent=o.value=x;e.appendChild(o)})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function buildInit(){let i=initial();$("initialInputs").innerHTML="";ACC.forEach(a=>$("initialInputs").insertAdjacentHTML("beforeend",`<label>${a}</label><input class="ib" data-a="${a}" type="number" inputmode="decimal" value="${Number(i[a]||0)}">`))}
function balances(data=entries()){let b={},i=initial();ACC.forEach(a=>b[a]=Number(i[a]||0));data.slice().sort((x,y)=>x.id-y.id).forEach(x=>{if(x.type==="expense")b[x.account]-=Number(x.amount||0);else if(x.type==="income")b[x.account]+=Number(x.amount||0);else{b[x.from]-=Number(x.amount||0);b[x.to]+=Number(x.amount||0)}});return b}
function saveInit(){let o={};document.querySelectorAll(".ib").forEach(x=>o[x.dataset.a]=Number(x.value||0));localStorage.setItem("ql3_initial",JSON.stringify(o));$("setupCard").classList.add("hide");render()}
function setMode(m){mode=m;["Expense","Income","Transfer"].forEach(k=>$("tab"+k).classList.toggle("active",m===k.toLowerCase()));$("expenseFields").classList.toggle("hide",m!=="expense");$("incomeFields").classList.toggle("hide",m!=="income");$("transferFields").classList.toggle("hide",m!=="transfer");$("saveEntry").textContent=m==="expense"?"記一筆支出":m==="income"?"記一筆收入":"記一筆轉帳"}
function syncMerchantOptions(){
  const cat=$("expenseCategory").value, data=merchantData(), list=data[cat]||[];
  $("merchantSelect").innerHTML="";
  list.forEach(x=>{let o=document.createElement("option");o.value=o.textContent=x;$("merchantSelect").appendChild(o)});
  let custom=document.createElement("option");custom.value="__custom";custom.textContent="其他／自行輸入";$("merchantSelect").appendChild(custom);
  $("customMerchant").classList.toggle("hide",$("merchantSelect").value!=="__custom");
  renderMerchantTags();
}
function renderMerchantTags(){
  const cat=$("expenseCategory").value,data=merchantData(),arr=data[cat]||[];
  $("merchantTags").innerHTML=arr.length?arr.map((x,i)=>`<span class="merchantTag">${esc(x)}<button type="button" data-mi="${i}">×</button></span>`).join(""):'<span class="meta">尚未設定常用店家</span>';
  document.querySelectorAll("[data-mi]").forEach(b=>b.onclick=()=>{let d=merchantData();d[cat].splice(Number(b.dataset.mi),1);saveMerchants(d);syncMerchantOptions()});
}
function addMerchant(){
  const cat=$("expenseCategory").value,n=$("newMerchant").value.trim();if(!n)return;
  let d=merchantData();d[cat]=d[cat]||[];if(!d[cat].includes(n))d[cat].push(n);saveMerchants(d);$("newMerchant").value="";syncMerchantOptions();$("merchantSelect").value=n;$("customMerchant").classList.add("hide");
}
function currentExpenseName(){return $("merchantSelect").value==="__custom"?$("customMerchant").value.trim():$("merchantSelect").value}
function add(){
  let amount=Number($("amount").value);if(!amount||amount<=0){alert("先輸入金額");return}
  let name="";
  if(mode==="expense")name=currentExpenseName();
  if(mode==="income")name=$("incomeName").value.trim();
  if(mode==="transfer")name=$("transferName").value.trim();
  if(!name)name=mode==="transfer"?$("transferKind").value:"未命名";
  let x={id:Date.now(),ts:new Date().toISOString(),type:mode,amount,name,note:$("note").value.trim()};
  if(mode==="expense")Object.assign(x,{category:$("expenseCategory").value,payment:$("payment").value,account:$("expenseAccount").value});
  if(mode==="income")Object.assign(x,{category:$("incomeCategory").value,payment:"收入",account:$("incomeAccount").value});
  if(mode==="transfer"){if($("fromAccount").value===$("toAccount").value){alert("轉出與轉入帳戶不能相同");return}Object.assign(x,{category:$("transferKind").value,payment:"轉帳",from:$("fromAccount").value,to:$("toAccount").value})}
  let d=entries();d.unshift(x);localStorage.setItem("ql3_entries",JSON.stringify(d));
  $("amount").value="";$("customMerchant").value="";$("incomeName").value="";$("transferName").value="";$("note").value="";render();
}
function monthEntries(d){
  let n=new Date();
  return d.filter(x=>{let q=new Date(x.ts);return q.getFullYear()===n.getFullYear()&&q.getMonth()===n.getMonth()});
}
function renderCategorySummary(month){
  let by={};EC.forEach(c=>by[c]=0);month.filter(x=>x.type==="expense").forEach(x=>by[x.category]=(by[x.category]||0)+Number(x.amount||0));
  $("categorySummary").innerHTML=EC.map(c=>`<button class="categoryCard ${categoryFilter===c?"active":""}" data-cat="${esc(c)}"><small>${esc(c)}</small><strong>${money(by[c]||0)}</strong></button>`).join("");
  document.querySelectorAll(".categoryCard").forEach(b=>b.onclick=()=>{categoryFilter=b.dataset.cat;render()});
  $("activeFilter").classList.toggle("hide",!categoryFilter);
  $("activeFilter").innerHTML=categoryFilter?`目前只看：<strong>${esc(categoryFilter)}</strong>　<button class="editBtn" id="inlineClear">取消篩選</button>`:"";
  if($("inlineClear"))$("inlineClear").onclick=()=>{categoryFilter="";render()};
}
function openEdit(id){
  editingId=Number(id);let x=entries().find(e=>e.id===editingId);if(!x)return;
  $("editExpenseFields").classList.toggle("hide",x.type!=="expense");
  $("editIncomeFields").classList.toggle("hide",x.type!=="income");
  $("editTransferFields").classList.toggle("hide",x.type!=="transfer");
  if(x.type==="expense"){
    $("editAmount").value=x.amount;$("editCategory").value=x.category;$("editName").value=x.name||"";$("editPayment").value=x.payment||Object.keys(PAY)[0];syncEditAccount(x.account);$("editNote").value=x.note||"";
  }else if(x.type==="income"){
    $("editIncomeAmount").value=x.amount;$("editIncomeName").value=x.name||"";$("editIncomeCategory").value=x.category;$("editIncomeAccount").value=x.account;$("editIncomeNote").value=x.note||"";
  }else{
    $("editTransferAmount").value=x.amount;$("editTransferName").value=x.name||"";$("editFrom").value=x.from;$("editTo").value=x.to;$("editTransferKind").value=x.category||"帳戶互轉";$("editTransferNote").value=x.note||"";
  }
  $("editModal").classList.remove("hide");document.body.classList.add("modalOpen");
}
function closeEdit(){editingId=null;$("editModal").classList.add("hide");document.body.classList.remove("modalOpen")}
function syncEditAccount(preferred){
  let opts=PAY[$("editPayment").value]||ACC;fill($("editAccount"),opts);if(preferred&&opts.includes(preferred))$("editAccount").value=preferred;
}
function saveEdit(){
  let d=entries(),i=d.findIndex(e=>e.id===editingId);if(i<0)return;let x=d[i];
  if(x.type==="expense"){
    let a=Number($("editAmount").value);if(!a||a<=0)return alert("金額要大於 0");
    Object.assign(x,{amount:a,category:$("editCategory").value,name:$("editName").value.trim()||"未命名",payment:$("editPayment").value,account:$("editAccount").value,note:$("editNote").value.trim()});
  }else if(x.type==="income"){
    let a=Number($("editIncomeAmount").value);if(!a||a<=0)return alert("金額要大於 0");
    Object.assign(x,{amount:a,name:$("editIncomeName").value.trim()||"未命名",category:$("editIncomeCategory").value,account:$("editIncomeAccount").value,payment:"收入",note:$("editIncomeNote").value.trim()});
  }else{
    let a=Number($("editTransferAmount").value);if(!a||a<=0)return alert("金額要大於 0");
    if($("editFrom").value===$("editTo").value)return alert("轉出與轉入帳戶不能相同");
    Object.assign(x,{amount:a,name:$("editTransferName").value.trim()||$("editTransferKind").value,from:$("editFrom").value,to:$("editTo").value,category:$("editTransferKind").value,payment:"轉帳",note:$("editTransferNote").value.trim()});
  }
  d[i]=x;localStorage.setItem("ql3_entries",JSON.stringify(d));closeEdit();render();
}
function render(){
  let d=entries(),b=balances(d);
  $("balances").innerHTML="";ACC.forEach(a=>$("balances").insertAdjacentHTML("beforeend",`<div class="bal"><small>${a}</small><strong>${money(b[a])}</strong></div>`));
  $("totalAssets").textContent=money(Object.values(b).reduce((s,x)=>s+x,0));
  let month=monthEntries(d),inc=month.filter(x=>x.type==="income").reduce((s,x)=>s+Number(x.amount||0),0),exp=month.filter(x=>x.type==="expense").reduce((s,x)=>s+Number(x.amount||0),0);
  $("sumIncome").textContent=money(inc);$("sumExpense").textContent=money(exp);$("sumBalance").textContent=(inc-exp<0?"-":"")+money(Math.abs(inc-exp));
  renderCategorySummary(month);
  let by={};month.filter(x=>x.type==="expense").forEach(x=>by[x.category]=(by[x.category]||0)+Number(x.amount||0));
  let vals=Object.entries(by).filter(([,v])=>v>0),total=vals.reduce((s,[,v])=>s+v,0),start=0,parts=[];$("legend").innerHTML="";
  vals.forEach(([k,v],i)=>{let end=start+(v/total)*360;parts.push(`${COLORS[i%COLORS.length]} ${start}deg ${end}deg`);start=end;$("legend").insertAdjacentHTML("beforeend",`<div class="legendRow"><span><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${esc(k)}</span><strong>${Math.round(v/total*100)}% · ${money(v)}</strong></div>`)});
  $("pie").style.background=total?`conic-gradient(${parts.join(",")})`:"#eee";if(!total)$("legend").innerHTML='<div class="meta">本月還沒有支出</div>';

  let run={},ini=initial(),after={};ACC.forEach(a=>run[a]=Number(ini[a]||0));
  d.slice().sort((x,y)=>x.id-y.id).forEach(x=>{if(x.type==="expense"){run[x.account]-=Number(x.amount||0);after[x.id]=`${x.account} ${money(run[x.account])}`}else if(x.type==="income"){run[x.account]+=Number(x.amount||0);after[x.id]=`${x.account} ${money(run[x.account])}`}else{run[x.from]-=Number(x.amount||0);run[x.to]+=Number(x.amount||0);after[x.id]=`${x.from} ${money(run[x.from])} ／ ${x.to} ${money(run[x.to])}`}});
  let type=$("recordTypeFilter").value||"all",shown=d.filter(x=>type==="all"||x.type===type).filter(x=>!categoryFilter||(x.type==="expense"&&x.category===categoryFilter));
  $("list").innerHTML=shown.length?"":'<div class="empty">這個篩選目前沒有紀錄</div>';
  shown.slice(0,100).forEach(x=>{
    let dt=new Date(x.ts),cls=x.type,sign=x.type==="expense"?"-":x.type==="income"?"+":"↔";
    let detail=x.type==="transfer"?`${x.category} · ${x.from} → ${x.to}`:`${x.category} · ${x.payment} · ${x.account}`;
    $("list").insertAdjacentHTML("beforeend",`<div class="tx"><div><div class="title">${esc(x.name)}</div><div class="meta"><span class="txCategory">${esc(x.category)}</span>${dt.toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="meta">${esc(detail)}</div><div class="meta">交易後餘額：${esc(after[x.id])}</div>${x.note?`<div class="meta">備註：${esc(x.note)}</div>`:""}<div class="txActions"><button class="editBtn" data-edit="${x.id}">編輯</button><button class="del" data-id="${x.id}">刪除</button></div></div><div class="amt ${cls}">${sign}${money(x.amount)}</div></div>`)
  });
  document.querySelectorAll("[data-edit]").forEach(x=>x.onclick=()=>openEdit(x.dataset.edit));
  document.querySelectorAll(".del").forEach(x=>x.onclick=()=>{if(confirm("確定刪除這筆紀錄？")){localStorage.setItem("ql3_entries",JSON.stringify(entries().filter(y=>y.id!==Number(x.dataset.id))));render()}});
}
function backupJSON(){
  const payload={app:"記一夏",version:7,exportedAt:new Date().toISOString(),initial:initial(),entries:entries(),merchants:merchantData()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");
  const d=new Date(),pad=n=>String(n).padStart(2,"0");a.href=u;a.download=`記一夏_備份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;a.click();URL.revokeObjectURL(u);
}
function restoreJSONFile(file){
  if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||typeof data!=="object"||!Array.isArray(data.entries)||typeof data.initial!=="object")throw new Error("格式不符");
  if(!confirm(`將還原 ${data.entries.length} 筆紀錄，並覆蓋目前資料。確定要繼續嗎？`))return;
  localStorage.setItem("ql3_initial",JSON.stringify(data.initial));localStorage.setItem("ql3_entries",JSON.stringify(data.entries));if(data.merchants)localStorage.setItem("ql7_merchants",JSON.stringify(data.merchants));buildInit();$("setupCard").classList.add("hide");syncMerchantOptions();render();alert("資料已還原完成")}catch(e){alert("這個檔案不是有效的「記一夏」備份檔。")} $("restoreFile").value=""};r.readAsText(file);
}
function exportCSV(){let d=entries();if(!d.length){alert("目前沒有資料");return}let rows=[["日期時間","類型","金額","名稱","分類","付款方式","帳戶/轉出","轉入","備註"]];d.slice().reverse().forEach(x=>rows.push([new Date(x.ts).toLocaleString("zh-TW"),x.type==="expense"?"支出":x.type==="income"?"收入":"轉帳",x.amount,x.name,x.category,x.payment,x.account||x.from||"",x.to||"",x.note||""]));let csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="記一夏_記帳資料.csv";a.click();URL.revokeObjectURL(u)}

fill($("payment"),Object.keys(PAY));fill($("expenseCategory"),EC);fill($("incomeCategory"),IC);fill($("incomeAccount"),ACC);fill($("fromAccount"),ACC);fill($("toAccount"),ACC);
fill($("editCategory"),EC);fill($("editPayment"),Object.keys(PAY));fill($("editIncomeCategory"),IC);fill($("editIncomeAccount"),ACC);fill($("editFrom"),ACC);fill($("editTo"),ACC);

$("editInitial").addEventListener("click",()=>{$("setupCard").classList.remove("hide");buildInit();$("setupCard").scrollIntoView({behavior:"smooth"})});

$("saveEntry").addEventListener("click",add);$("exportCsv").addEventListener("click",exportCSV);

if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
